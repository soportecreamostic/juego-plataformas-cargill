    <path d="M22 17 Q23 11 32 10 Q41 11 42 17 L40 24 H24Z" fill="url(#gSkin)"/>
    <path d="M23 17 Q21 16 20 18" fill="none"/>
    <circle cx="27.5" cy="17.5" r="0.95" fill="#231F20" stroke="none"/>
    <circle cx="36.5" cy="17.5" r="0.95" fill="#231F20" stroke="none"/>
    <path d="M29 20 Q32 22 35 20" fill="none"/>
  </g>

  <g id="torso" stroke="#231F20" stroke-width="1.05" stroke-linejoin="round">
