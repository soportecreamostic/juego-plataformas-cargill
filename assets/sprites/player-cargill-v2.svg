<svg xmlns="http://www.w3.org/2000/svg" width="512" height="64" viewBox="0 0 512 64">
<defs>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4D9A59"/>
    <stop offset="1" stop-color="#166338"/>
  </linearGradient>
  <linearGradient id="gCap" x1="0" y1="0" x2="1" y2="1">
