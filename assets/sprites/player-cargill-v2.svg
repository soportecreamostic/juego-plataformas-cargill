    <path d="M24 28 L21 38 M40 28 L43 38" stroke="#BDE588" stroke-width="1"/>
    <path d="M28 27 L27 44 M36 27 L37 44" stroke="#9ECF78" stroke-width=".8" opacity=".65"/>
    <rect x="28.5" y="33" width="7" height="8" rx="1" fill="#F5F9ED"/>
    <path d="M32 33 V41" stroke="#398245" stroke-width=".7"/>
    <circle cx="32" cy="36" r="1" fill="#BDE588" stroke="none"/>
    <path d="M25 40 H39" stroke="#0B4D2B" stroke-width="1.4"/>
  </g>

  <g id="boot" stroke="#231F20" stroke-width="1.0" stroke-linejoin="round">
