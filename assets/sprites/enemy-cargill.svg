<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4D9A59"/>
    <stop offset="1" stop-color="#0F5630"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EEF4EA"/>
    <stop offset="1" stop-color="#BFCDBF"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#012912" flood-opacity=".28"/>
  </filter>
</defs>

<g filter="url(#shadow)" stroke="#231F20" stroke-linejoin="round" stroke-linecap="round">

  <!-- soft sensor glow -->
  <circle cx="32" cy="30" r="27" fill="#BDE588" opacity=".15" stroke="none"/>

  <!-- antenna -->
  <path d="M32 13 V8" stroke="#398245" stroke-width="2.2"/>
  <circle cx="32" cy="6.5" r="2.3" fill="#BDE588"/>

  <!-- side sensor arms -->
  <path d="M15 28 H9" stroke="#012912" stroke-width="3"/>
  <circle cx="8" cy="28" r="3" fill="#ED3624"/>
  <path d="M49 28 H55" stroke="#012912" stroke-width="3"/>
  <circle cx="56" cy="28" r="3" fill="#F5D120"/>

  <!-- main chassis -->
  <rect x="13" y="17" width="38" height="29" rx="8" fill="url(#body)" stroke-width="1.5"/>

  <!-- upper panel -->
  <rect x="18" y="20" width="28" height="14" rx="4" fill="url(#metal)" stroke-width="1.2"/>

  <!-- scanner -->
  <rect x="22" y="24" width="20" height="6" rx="3" fill="#012912"/>
  <circle cx="27" cy="27" r="2.1" fill="#02A7E0" stroke="none"/>
  <circle cx="37" cy="27" r="2.1" fill="#02A7E0" stroke="none"/>

  <!-- center status light -->
  <circle cx="32" cy="38.5" r="3.5" fill="#BDE588"/>
  <circle cx="32" cy="38.5" r="1.5" fill="#FFFFFF"/>

  <!-- side reinforcement -->
  <rect x="15.5" y="35" width="5" height="7" rx="1.5" fill="#0B4D2B"/>
  <rect x="43.5" y="35" width="5" height="7" rx="1.5" fill="#0B4D2B"/>

  <!-- wheels -->
  <circle cx="21" cy="48" r="7" fill="#231F20" stroke-width="1"/>
  <circle cx="43" cy="48" r="7" fill="#231F20" stroke-width="1"/>
  <circle cx="21" cy="48" r="3" fill="#BDE588" stroke="none"/>
  <circle cx="43" cy="48" r="3" fill="#BDE588" stroke="none"/>

  <!-- small Cargill-inspired leaf mark, decorative -->
  <path d="M32 41 Q35 37 39 39 Q37 43 33 43 Q31 43 32 41Z" fill="#BDE588" stroke="none"/>
  <path d="M34 42 Q36 40 38 39" stroke="#398245" stroke-width=".8" fill="none"/>

</g>
</svg>